name: transcendence-prod

services:

  database:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
      database:
        condition: service_healthy
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://${DATABASE_HOST:-database}:${DATABASE_PORT:-5432}/${DATABASE_NAME}
      QUARKUS_DATASOURCE_USERNAME: ${DATABASE_USER}
      QUARKUS_DATASOURCE_PASSWORD: ${DATABASE_PASSWORD}
      QUARKUS_HTTP_CORS_ORIGINS: ${FRONTEND_ORIGIN:-http://localhost,http://127.0.0.1,FRONTEND_SERVER_NAME}
      QUARKUS_DATASOURCE_WEB_ID_GOOGLE: ${GOOGLE_WEB_CLIENT_ID}
      QUARKUS_GOOGLE_WEB_CLIENT_SECRET: ${GOOGLE_WEB_CLIENT_SECRET}
      QUARKUS_GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      QUARKUS_HTTP_PROXY_PROXY_ADDRESS_FORWARDING: "true"
      QUARKUS_MINIO_HOST: ${MINIO_API_ENDPOINT}
      QUARKUS_MINIO_PORT: 443
      QUARKUS_MINIO_ENDPOINT: http://minio:9000
      QUARKUS_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      QUARKUS_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      QUARKUS_MINIO_SECURE: "true"
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/q/health/live >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s

  minio:
    image: quay.io/minio/minio
    container_name: minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      MINIO_SERVER_URL: https://${MINIO_API_ENDPOINT}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ~/minio/data:/data
    command: server /data --console-address ":9001"

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL}
        VITE_GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID}
        FRONTEND_SERVER_NAME: ${FRONTEND_SERVER_NAME}
        BACKEND_SERVER_NAME: ${BACKEND_SERVER_NAME}
        MINIO_ENDPOINT: ${MINIO_ENDPOINT}
        MINIO_API_ENDPOINT: ${MINIO_API_ENDPOINT}
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./certs/fullchain.pem:/etc/nginx/certs/nginx.crt:ro
      - ./certs/privkey.pem:/etc/nginx/certs/nginx.key:ro
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      default:
        aliases:
          - ${MINIO_ENDPOINT}
          - ${MINIO_API_ENDPOINT}
          - ${BACKEND_SERVER_NAME}

  # --- SERVIÇOS DE MONITORAMENTO ---

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"  # exposto só localmente em prod
    volumes:
      - ./monitoring/prometheus/prometheus.prod.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/prometheus/alertrules.yml:/etc/prometheus/alertrules.yml
      - prometheus_data:/prometheus
    depends_on:
      backend:
        condition: service_healthy

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"  # exposto só localmente em prod
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus

  alertmanager:
    image: prom/alertmanager
    container_name: alertmanager
    restart: unless-stopped
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    ports:
      - "127.0.0.1:9093:9093"  # exposto só localmente em prod

volumes:
  db_data:
  prometheus_data:
  grafana_data: