name: transcendence-prod

services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT:-5432}/${DATABASE_NAME}
      QUARKUS_DATASOURCE_USERNAME: ${DATABASE_USER}
      QUARKUS_DATASOURCE_PASSWORD: ${DATABASE_PASSWORD}
      QUARKUS_HTTP_CORS_ORIGINS: ${FRONTEND_ORIGIN:-http://localhost,http://127.0.0.1}
      QUARKUS_DATASOURCE_WEB_ID_GOOGLE: ${WEB_CLIENT_ID_GOOGLE}
      QUARKUS_GOOGLE_WEB_CLIENT_SECRET: ${GOOGLE_WEB_CLIENT_SECRET}
      QUARKUS_GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
    # Só “healthy” quando o Quarkus responde (evita o browser bater na API antes do back estar pronto)
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/q/health/live >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL}
        WEB_CLIENT_ID_GOOGLE: ${WEB_CLIENT_ID_GOOGLE}
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

