name: transcendence-prod

services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://${DATABASE_HOST:-database}:${DATABASE_PORT:-5432}/${DATABASE_NAME}
      QUARKUS_DATASOURCE_USERNAME: ${DATABASE_USER}
      QUARKUS_DATASOURCE_PASSWORD: ${DATABASE_PASSWORD}
      QUARKUS_HTTP_CORS_ORIGINS: ${FRONTEND_ORIGIN:-http://localhost,http://127.0.0.1,FRONTEND_SERVER_NAME}
      QUARKUS_DATASOURCE_WEB_ID_GOOGLE: ${GOOGLE_WEB_CLIENT_ID}
      QUARKUS_GOOGLE_WEB_CLIENT_SECRET: ${GOOGLE_WEB_CLIENT_SECRET}
      QUARKUS_GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      QUARKUS_HTTP_PROXY_PROXY_ADDRESS_FORWARDING: "true"
      QUARKUS_MINIO_HOST: ${MINIO_API_ENDPOINT}
      QUARKUS_MINIO_PORT: 80
      QUARKUS_MINIO_ENDPOINT: http://minio:9000
      QUARKUS_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      QUARKUS_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      QUARKUS_MINIO_SECURE: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/q/health/live >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s

  database:
    image: postgres:16-alpine3.23
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10s

  minio:
    image: quay.io/minio/minio
    container_name: minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      MINIO_SERVER_URL: http://${MINIO_API_ENDPOINT}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ~/minio/data:/data
    command: server /data --console-address ":9001"

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL}
        VITE_GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID}
        FRONTEND_SERVER_NAME: ${FRONTEND_SERVER_NAME}
        BACKEND_SERVER_NAME: ${BACKEND_SERVER_NAME}
        MINIO_ENDPOINT: ${MINIO_ENDPOINT}
        MINIO_API_ENDPOINT: ${MINIO_API_ENDPOINT}

    ports:
      - "80:80"
      - "443:443"
    # volumes:
    #   - /etc/letsencrypt/live/SEU_DOMINIO/fullchain.pem:/etc/nginx/certs/nginx.crt:ro
    #   - /etc/letsencrypt/live/SEU_DOMINIO/privkey.pem:/etc/nginx/certs/nginx.key:ro
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      default:
        aliases:
          - ${MINIO_ENDPOINT}
          - ${MINIO_API_ENDPOINT}
          - ${BACKEND_SERVER_NAME}

volumes:
  db_data:

