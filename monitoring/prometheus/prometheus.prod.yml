global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alertrules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

scrape_configs:
  - job_name: 'transcendence-backend'
    metrics_path: '/q/metrics'
    static_configs:
      - targets: ['backend:8080']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
