global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h
  receiver: 'discord-notifications'

  routes:
    - match:
        severity: critical
      receiver: 'discord-notifications'
      repeat_interval: 30m  # critical repete mais rápido

    - match:
        severity: warning
      receiver: 'discord-notifications'
      repeat_interval: 1h

receivers:
  - name: 'discord-notifications'
    discord_configs:
      - webhook_url: 'https://discord.com/api/webhooks/1496673516467261625/QyezrkSKp4gXsgNBDdENttWS1HLDu-TZnee9lXIoqIw1_NbVI2hbMQimXU65X-HPNQd8'
        send_resolved: true
        title: >-
          {{ if eq .Status "firing" }}
            {{ if eq (index .Alerts 0).Labels.severity "critical" }}🚨{{ else }}⚠️{{ end }} {{ .GroupLabels.alertname }}
          {{ else }}
            ✅ RESOLVIDO: {{ .GroupLabels.alertname }}
          {{ end }}
        message: >-
          {{ if eq .Status "resolved" }}
          🟢 **Serviço normalizado!**
          O alerta **{{ .GroupLabels.alertname }}** foi resolvido com sucesso.
          {{ else }}
          {{ range .Alerts }}
          **Severidade:** {{ if eq .Labels.severity "critical" }}🔴 Critical{{ else }}🟡 Warning{{ end }}
          **Alerta:** {{ .Labels.alertname }}
          **Descrição:** {{ .Annotations.description }}
          **Início:** {{ .StartsAt.Format "02/01/2006 15:04:05" }}
          {{ end }}
          {{ end }}

inhibit_rules:
  # Se critical já disparou para o mesmo alerta, suprime o warning duplicado
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname']