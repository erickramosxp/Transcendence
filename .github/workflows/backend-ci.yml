name: Backend CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: transc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test -d transc_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      # Config que o Quarkus vai usar nos testes
      QUARKUS_DATASOURCE_DB_KIND: postgresql
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://localhost:5432/transc_test
      QUARKUS_DATASOURCE_USERNAME: test
      QUARKUS_DATASOURCE_PASSWORD: test
      QUARKUS_FLYWAY_MIGRATE_AT_START: "true"
      QUARKUS_HIBERNATE_ORM_DATABASE_GENERATION: none
      GOOGLE_OAUTH_WEB_CLIENT_ID: test-client-id

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make mvnw executable
        working-directory: backend
        run: chmod +x mvnw

      - name: Wait for Postgres
        run: |
          for i in {1..10}; do
            if pg_isready -h localhost -p 5432 -U test; then
              echo "Postgres is up";
              break;
            fi
            echo "Waiting for Postgres..."
            sleep 5
          done

      - name: Build and test
        working-directory: backend
        run: ./mvnw -B clean test

