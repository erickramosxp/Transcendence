name: CI and CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      GOOGLE_OAUTH_WEB_CLIENT_ID: test-client-id
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make mvnw executable
        working-directory: backend
        run: chmod +x mvnw

      - name: Build and test
        working-directory: backend
        run: ./mvnw -B clean test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # lint omitido até o ESLint do projeto estar limpo (npm run lint)
      - name: Install, test and build
        working-directory: frontend
        run: |
          npm ci
          npx vitest run
          npm run build

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-digitalocean
      cancel-in-progress: true

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 25m
          script_stop: true
          script: |
            set -euo pipefail
            cd ${{ secrets.DEPLOY_PATH }}
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            make build
            echo "Smoke: API via Nginx (/api → Quarkus health)"
            curl -fsS http://127.0.0.1/api/q/health/live >/dev/null
            echo "Smoke: frontend HTTP"
            curl -fsS -o /dev/null http://127.0.0.1/
