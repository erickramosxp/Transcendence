user nginx;
worker_processes auto;

error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;

    server_tokens off;

    keepalive_timeout 65;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    client_max_body_size 1M;

    resolver 127.0.0.11 valid=30s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api:10m     rate=5r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m    rate=1r/s;
    limit_req_status 429;
    limit_req_log_level warn;

    map $http_user_agent $bad_bot {
        default                                     0;
        ""                                          1;
        "~*(sqlmap|nikto|nessus|masscan|zgrab)"     1;
        "~*(nuclei|gobuster|dirbuster|hydra)"       1;
        "~*(wpscan|acunetix|appscan|fimap)"         1;
    }

    map $request_method $not_allowed_method {
        default                                     1;
        GET                                         0;
        HEAD                                        0;
        POST                                        0;
        PUT                                         0;
        PATCH                                       0;
        DELETE                                      0;
        OPTIONS                                     0;
    }

    ssl_certificate /etc/nginx/certs/nginx.crt;
    ssl_certificate_key /etc/nginx/certs/nginx.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    server {
        listen 80 default_server;
        listen 443 ssl default_server;
        http2 on;
        server_name _;
        ssl_reject_handshake on;
        return 444;
    }

    server {
        listen 80;

        server_name FRONTEND_SERVER_NAME BACKEND_SERVER_NAME MINIO_API_ENDPOINT MINIO_ENDPOINT GRAFANA_SERVER_NAME PROMETHEUS_SERVER_NAME;

        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name FRONTEND_SERVER_NAME;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        if ($not_allowed_method) {
            return 405;
        }

        if ($bad_bot) {
            return 444;
        }

        root /usr/share/nginx/html;
        index index.html;

        include /etc/nginx/spa-locations.conf;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name BACKEND_SERVER_NAME;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        if ($not_allowed_method) {
            return 405;
        }

        if ($bad_bot) {
            return 444;
        }

        location = /ws/realtime {
            proxy_pass http://backend:8080/ws/realtime;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
        }

        location = /posts {
            client_max_body_size 21M;
            limit_req zone=api burst=20 nodelay;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            proxy_pass http://backend:8080;
        }

        location = /user/avatar {
            client_max_body_size 5M;
            limit_req zone=api burst=20 nodelay;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            proxy_pass http://backend:8080;
        }

        location ~ ^/auth/(login|register)$ {
            limit_req zone=auth burst=5 nodelay;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            proxy_pass http://backend:8080;
        }

        location / {
            limit_req zone=api burst=20 nodelay;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            proxy_pass http://backend:8080;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name MINIO_API_ENDPOINT;

        client_max_body_size 21M;
        proxy_request_buffering off;
        proxy_http_version 1.1;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        if ($bad_bot) {
            return 444;
        }

        location / {
            proxy_http_version 1.1;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            proxy_pass http://minio:9000;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name MINIO_ENDPOINT;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        if ($not_allowed_method) {
            return 405;
        }

        if ($bad_bot) {
            return 444;
        }

        location / {
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            proxy_pass http://minio:9001;
        }
    }

    server {
        listen 443 ssl;
        http2 on;

        server_name GRAFANA_SERVER_NAME;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        if ($bad_bot) {
            return 444;
        }

        auth_basic "Monitoring";
        auth_basic_user_file /etc/nginx/.htpasswd;

        location = /api/live/ws {
            proxy_pass http://grafana:3000;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            proxy_buffering off;
        }

        location / {
            proxy_pass http://grafana:3000;
            proxy_http_version 1.1;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name PROMETHEUS_SERVER_NAME;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        if ($bad_bot) {
            return 444;
        }

        auth_basic "Monitoring";
        auth_basic_user_file /etc/nginx/.htpasswd;

        location / {
            proxy_pass http://prometheus:9090;
            proxy_http_version 1.1;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }
    }
}