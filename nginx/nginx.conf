user nginx;
worker_processes auto;

error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    client_max_body_size 21M;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    ssl_certificate /etc/nginx/certs/nginx.crt;
    ssl_certificate_key /etc/nginx/certs/nginx.key;
    ssl_protocols	TLSv1.2 TLSv1.3;

    server {
        listen 80;

        server_name FRONTEND_SERVER_NAME BACKEND_SERVER_NAME MINIO_API_ENDPOINT MINIO_ENDPOINT; 

        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;

        server_name FRONTEND_SERVER_NAME;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        root /usr/share/nginx/html;
        index index.html;

        include /etc/nginx/spa-locations.conf;
    }

    server { 
        listen 443 ssl;
        http2 on;

        server_name BACKEND_SERVER_NAME;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        location / {
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_pass http://backend:8080;
        }

        location /ws/realtime {
            proxy_pass http://backend:8080/ws/realtime;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;

            proxy_buffering off;
        }
    }

	server {
		listen 443 ssl;
		http2 on;

		server_name MINIO_API_ENDPOINT;

		add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

		location / {
            proxy_set_header Host $http_host;
			proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://minio:9000;
        }
	}

	server {
		listen 443 ssl;
		http2 on;

        server_name MINIO_ENDPOINT;

		add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

		location / {
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_pass http://minio:9001;
        }
	}
}
