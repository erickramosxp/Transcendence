set $csp "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; script-src-elem 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https:; style-src-elem 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https: wss:; font-src 'self' data: https:; frame-src 'self' https:; frame-ancestors 'self'; form-action 'self' https:; base-uri 'self'; object-src 'none'; worker-src 'self' blob:; manifest-src 'self'";

location ~* \.(php|asp|aspx|jsp|cgi)$ {
    return 444;
}

location ~* /(wp-admin|wp-login|wp-content|wp-includes|wordpress) {
    return 444;
}

location ~* /(zabbix|phpmyadmin|adminer|webmail|cpanel|xmlrpc) {
    return 444;
}

location ~* /\.(env|git|aws|ssh|htaccess|htpasswd|svn) {
    return 444;
}

location = /index.html {
    try_files $uri =404;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Content-Security-Policy $csp always;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}

location / {
    limit_req zone=general burst=30 nodelay;

    try_files $uri $uri/ /index.html;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Content-Security-Policy $csp always;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}

location ~* \.(?:js|mjs|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|ttf|map)$ {
    try_files $uri =404;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

    expires 1y;
    add_header Cache-Control "public, immutable" always;
}
