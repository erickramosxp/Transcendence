server {
    # Porta em que o Nginx vai escutar
    listen 80;

    # Nome do servidor (não é usado aqui, mas é permitido)
    server_name _;

    # Onde ficam os arquivos estáticos do build do Vite
    root /usr/share/nginx/html;

    # Arquivo padrão ao acessar "/"
    index index.html;

    # Regra principal:
    # tenta servir o arquivo solicitado (ex: /assets/app.js)
    # se não existir, cai para /index.html (para rotas do React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Regra para arquivos estáticos pesados (cache “eterno” para assets versionados)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires max;
        add_header Cache-Control "public, immutable";
    }
}
