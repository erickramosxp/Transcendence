services:

  backend_dev:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - ~/.m2:/root/.m2
    environment:
      QUARKUS_PROFILE: dev
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://database_dev:5432/${DATABASE_NAME}
      QUARKUS_DATASOURCE_USERNAME: ${DATABASE_USER}
      QUARKUS_DATASOURCE_PASSWORD: ${DATABASE_PASSWORD}
      QUARKUS_HTTP_CORS_ORIGINS: ${DEV_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      QUARKUS_DATASOURCE_WEB_ID_GOOGLE: ${GOOGLE_WEB_CLIENT_ID}
      QUARKUS_GOOGLE_WEB_CLIENT_SECRET: ${GOOGLE_WEB_CLIENT_SECRET}
      QUARKUS_GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      QUARKUS_MINIO_HOST: minio-dev
      QUARKUS_MINIO_PORT: 9000
      QUARKUS_MINIO_ENDPOINT: http://localhost:9000
      QUARKUS_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      QUARKUS_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      QUARKUS_MINIO_SECURE: "false"

    depends_on:
      database_dev:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/q/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s

  frontend_dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      VITE_BACKEND_URL: http://localhost:8080
      GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend_dev:
        condition: service_healthy

  database_dev:
    image: postgres:16-alpine3.23
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10s
    
  minio-dev:
      image: quay.io/minio/minio
      container_name: minio-dev
      ports:
        - "9000:9000"
        - "9001:9001"
      environment:
        MINIO_ROOT_USER: ${MINIO_ROOT_USER}
        MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      volumes:
        - ~/minio/data:/data
      command: server /data --console-address ":9001"

volumes:
  db_data:

