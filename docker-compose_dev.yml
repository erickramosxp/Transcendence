services:

  backend_dev:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - ~/.m2:/root/.m2
    environment:
      QUARKUS_PROFILE: dev
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://database_dev:5432/${DATABASE_NAME}
      QUARKUS_DATASOURCE_USERNAME: ${DATABASE_USER}
      QUARKUS_DATASOURCE_PASSWORD: ${DATABASE_PASSWORD}
      QUARKUS_HTTP_CORS_ORIGINS: ${DEV_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8081,https://localhost:8443}
      QUARKUS_DATASOURCE_WEB_ID_GOOGLE: ${GOOGLE_WEB_CLIENT_ID}
      QUARKUS_GOOGLE_WEB_CLIENT_SECRET: ${GOOGLE_WEB_CLIENT_SECRET}
      QUARKUS_GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      QUARKUS_MINIO_HOST: http://minio-dev
      QUARKUS_MINIO_PORT: 9000
      QUARKUS_MINIO_ENDPOINT: http://minio-dev:9000
      QUARKUS_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      QUARKUS_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      QUARKUS_MINIO_SECURE: "false"
      MINIO_PUBLIC_URL: http://localhost:9000
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      EDITORIAL_USERNAME: ${EDITORIAL_USERNAME:-videanews}
      GNEWS_API_KEY: ${GNEWS_API_KEY:-}
      GNEWS_COUNTRY: ${GNEWS_COUNTRY:-br}
      GNEWS_LANG: ${GNEWS_LANG:-pt}
      GNEWS_MAX_PER_RUN: ${GNEWS_MAX_PER_RUN:-10}
    depends_on:
      database_dev:
        condition: service_healthy
      minio-dev:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/q/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s

  frontend_dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      VITE_BACKEND_URL: http://localhost:8080
      VITE_EDITORIAL_USERNAME: ${EDITORIAL_USERNAME:-videanews}
      GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend_dev:
        condition: service_healthy

  nginx_dev:
    build:
      context: .
      dockerfile: nginx/Dockerfile.dev
      args:
        VITE_BACKEND_URL: /api
        VITE_GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID}
        FRONTEND_SERVER_NAME: localhost
        BACKEND_SERVER_NAME: localhost
        MINIO_ENDPOINT: localhost
        MINIO_API_ENDPOINT: localhost
    ports:
      - "8081:80"
      - "8443:443"
    depends_on:
      backend_dev:
        condition: service_healthy

  database_dev:
    image: postgres:16-alpine3.23
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10s

  minio-dev:
    image: quay.io/minio/minio
    container_name: minio-dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_SERVER_URL: "http://localhost:9000"
      MINIO_DOMAIN: "localhost"
    volumes:
      - ./minio_data:/data
    command: ["server", "/data", "--console-address", ":9001"]

  # --- SERVIÇOS DE MONITORAMENTO ---

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.dev.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/prometheus/alertrules.yml:/etc/prometheus/alertrules.yml
      - prometheus_data:/prometheus
    depends_on:
      backend_dev:
        condition: service_healthy

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus

  alertmanager:
    image: prom/alertmanager
    container_name: alertmanager
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sed 's|DISCORD_WEBHOOK_PLACEHOLDER|'"$$DISCORD_WEBHOOK_URL"'|g; s|HEALTHCHECKS_PLACEHOLDER|'"$$HEALTHCHECKS_PING_URL"'|g' \
          /etc/alertmanager/alertmanager.template.yml > /tmp/alertmanager.yml && \
        /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager
    environment:
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}
      HEALTHCHECKS_PING_URL: ${HEALTHCHECKS_PING_URL}
    volumes:
      - ./monitoring/alertmanager/alertmanager.template.yml:/etc/alertmanager/alertmanager.template.yml
      - alertmanager_data:/alertmanager
    ports:
      - "9093:9093"

volumes:
  db_data:
  prometheus_data:
  grafana_data:
  alertmanager_data:
