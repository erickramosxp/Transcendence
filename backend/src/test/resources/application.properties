quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=test
quarkus.datasource.password=test

quarkus.flyway.migrate-at-start=true

google.oauth.web-client-id=${GOOGLE_OAUTH_WEB_CLIENT_ID:test-client-id}
google.oauth.web-client-id=test
google.oauth.web-client-secret=test
google.oauth.redirect-uri=postmessage
quarkus.http.body.uploads-directory=target/uploads
quarkus.http.limits.max-body-size=25M
# módulo de multipart do Quarkus
quarkus.http.limits.max-form-attribute-size=25M

quarkus.datasource.devservices.enabled=true
quarkus.datasource.devservices.image-name=postgres:16

%test.quarkus.scheduler.enabled=false

gnews.api-key=test-key
gnews.country=br
gnews.lang=pt
gnews.max-per-run=10
quarkus.rest-client.gnews.url=https://gnews.io/api/v4
