# Nome da aplicação
quarkus.application.name=transcendence

# Database
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DATABASE_USER}
quarkus.datasource.password=${DATABASE_PASSWORD}

# Evita Quarkus tentar DevServices/Testcontainers
quarkus.datasource.devservices.enabled=false

# Flyway
quarkus.flyway.migrate-at-start=true
quarkus.flyway.validate-at-start=false

# Hibernate
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.log.sql=true

# Configuração do servidor
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# Logs
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n

# Dev Mode
%dev.quarkus.log.level=INFO

# CORS
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost,http://127.0.0.1
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization
quarkus.http.cors.exposed-headers=Location
quarkus.http.cors.access-control-allow-credentials=true

# Verificação do token (quando alguém chama endpoints protegidos)
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=https://videa

# Assinatura (quando você gera token no /auth/login)
smallrye.jwt.sign.key.location=privateKey.pem

# Vida do token: 7 dias (em segundos)
smallrye.jwt.new-token.lifespan=604800
smallrye.jwt.new-token.issuer=https://videa

# OAuth2.0
google.oauth.web-client-id=${QUARKUS_DATASOURCE_WEB_ID_GOOGLE}
google.oauth.web-client-secret=${QUARKUS_GOOGLE_WEB_CLIENT_SECRET}
google.oauth.redirect-uri=${QUARKUS_GOOGLE_REDIRECT_URI}
quarkus.rest-client.google-oauth.url=https://oauth2.googleapis.com/

quarkus.http.limits.max-body-size=21M

# MinIO
quarkus.minio.access-key=${MINIO_ROOT_USER:minioadmin}
quarkus.minio.secret-key=${MINIO_ROOT_PASSWORD:minioadmin}
minio.bucket-name=${MINIO_BUCKET_NAME:transcendence}

# URL pública do MinIO usada para gerar presigned URLs acessíveis pelo browser.
# Em dev: http://localhost:9000
# Em prod: https://<MINIO_API_ENDPOINT>
minio.public-url=${MINIO_PUBLIC_URL:http://localhost:9000}
minio.access-key=${MINIO_ROOT_USER:minioadmin}
minio.secret-key=${MINIO_ROOT_PASSWORD:minioadmin}

# Editorial / Notícias do momento (MVP Flipboard-lite)
editorial.username=${EDITORIAL_USERNAME:videa}
gnews.api-key=${GNEWS_API_KEY:}
gnews.api-base-url=${GNEWS_API_BASE_URL:https://gnews.io/api/v4}
gnews.country=${GNEWS_COUNTRY:br}
gnews.lang=${GNEWS_LANG:pt}
gnews.max-per-run=${GNEWS_MAX_PER_RUN:10}
quarkus.rest-client.gnews.url=${gnews.api-base-url}

# Websocket
quarkus.http.auth.proactive=false
quarkus.http.auth.permission.websocket.paths=/ws/*
quarkus.http.auth.permission.websocket.policy=permit

# Métricas
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/q/metrics

# Permite usar @JdbcTypeCode(SqlTypes.JSON) sem conflito com o ObjectMapper dos endpoints REST.
# O Quarkus 3.x exige essa declaração explícita quando há configurações Jackson customizadas.
quarkus.hibernate-orm.mapping.format.global=ignore
